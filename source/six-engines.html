<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
html { width: 500px; background-color: #0a1828; }
body { width: 500px; background-color: #0a1828; background-image: radial-gradient(ellipse at 50% 30%, #14304a 0%, transparent 75%); color: white; padding: 28px 26px 28px; position: relative; }
.grid-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(125,255,212,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(125,255,212,0.04) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.6; pointer-events: none; }

.header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; position: relative; z-index: 2; }
.header-eyebrow { font-family: 'Courier New', monospace; font-size: 10px; color: #3ddc84; letter-spacing: 3px; padding: 5px 12px; border: 1px solid #3ddc84; background: rgba(61,220,132,0.08); }

.engines-stack { display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 2; }
.engine-card { background: rgba(10,24,40,0.7); border: 1px solid rgba(125,255,212,0.18); border-radius: 8px; padding: 13px 16px; display: flex; align-items: center; gap: 12px; position: relative; }
.engine-num { width: 28px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, #1E3A6B, #4A8BDF); display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; font-size: 13px; flex-shrink: 0; font-family: 'Courier New', monospace; }
.engine-name { flex: 1; font-size: 16px; font-weight: 700; color: white; letter-spacing: -0.2px; }
.engine-buzz { font-family: 'Courier New', monospace; font-size: 11px; color: #3ddc84; letter-spacing: 2px; font-weight: 700; flex-shrink: 0; text-transform: uppercase; }

.funnel-area { position: relative; margin: 14px 0 12px; height: 56px; z-index: 2; }
.funnel-svg { width: 100%; height: 100%; display: block; }

.aio-target { background-color: #14304a; background-image: linear-gradient(180deg, rgba(26,52,80,0.6) 0%, rgba(13,33,56,0.3) 100%); border: 2px solid #3ddc84; border-radius: 14px; padding: 22px 22px; box-shadow: 0 0 50px rgba(61,220,132,0.22); position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 22px; }
.target-shield { width: 72px; height: 84px; flex-shrink: 0; filter: drop-shadow(0 6px 22px rgba(74,139,223,0.55)); }
.target-name { font-size: 26px; font-weight: 800; color: white; letter-spacing: 3px; line-height: 1; }
</style></head><body>
<div class="grid-bg"></div>

<div class="header">
  <span class="header-eyebrow">[ DEFENSE.LAYERS // 6 ]</span>
</div>

<div class="engines-stack">
  <div class="engine-card"><div class="engine-num">1</div><div class="engine-name">Network Blocking</div><div class="engine-buzz">156K+ RULES</div></div>
  <div class="engine-card"><div class="engine-num">2</div><div class="engine-name">Script Defense</div><div class="engine-buzz">26K+ SCRIPTS</div></div>
  <div class="engine-card"><div class="engine-num">3</div><div class="engine-name">Element Hiding</div><div class="engine-buzz">EASYLIST</div></div>
  <div class="engine-card"><div class="engine-num">4</div><div class="engine-name">Site-Specific Rules</div><div class="engine-buzz">200K+ SITES</div></div>
  <div class="engine-card"><div class="engine-num">5</div><div class="engine-name">Dynamic Blocking</div><div class="engine-buzz">REAL-TIME</div></div>
  <div class="engine-card"><div class="engine-num">6</div><div class="engine-name">Malware Shield</div><div class="engine-buzz">URLHAUS</div></div>
</div>

<div class="funnel-area">
  <svg class="funnel-svg" viewBox="0 0 448 56" preserveAspectRatio="none">
    <line x1="36"  y1="0" x2="224" y2="40" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.85"/>
    <line x1="111" y1="0" x2="224" y2="40" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.85"/>
    <line x1="186" y1="0" x2="224" y2="40" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.85"/>
    <line x1="262" y1="0" x2="224" y2="40" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.85"/>
    <line x1="337" y1="0" x2="224" y2="40" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.85"/>
    <line x1="412" y1="0" x2="224" y2="40" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.85"/>
    <circle cx="224" cy="40" r="4" fill="#3ddc84"/>
    <line x1="224" y1="44" x2="224" y2="52" stroke="#3ddc84" stroke-width="2"/>
    <polygon points="219,50 224,56 229,50" fill="#3ddc84"/>
  </svg>
</div>

<div class="aio-target">
  <svg class="target-shield" viewBox="0 0 100 116">
    <path d="M 50,4 L 94,20 Q 94,76 50,112 Q 6,76 6,20 Z" fill="#1E3A6B"/>
    <path d="M 50,14 L 82,26 Q 82,68 50,98 Q 18,68 18,26 Z" fill="#2D5AA0"/>
    <path d="M 50,24 L 72,32 Q 72,60 50,82 Q 28,60 28,32 Z" fill="#4A8BDF"/>
    <circle cx="50" cy="49" r="11" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="42" y1="41" x2="58" y2="57" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="target-name">ALL-IN-ONE</div>
</div>
</body></html>
