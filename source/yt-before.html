<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; }
body { width: 500px; height: 430px; background: #0f0f0f; color: white; padding: 0; overflow: hidden; }
.yt-header { background: #0f0f0f; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #272727; }
.yt-logo { display: flex; align-items: center; gap: 5px; }
.yt-play { width: 28px; height: 20px; background: #ff0000; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
.yt-play::after { content: "▶"; color: white; font-size: 10px; margin-left: 2px; }
.yt-brand { font-size: 16px; font-weight: 700; letter-spacing: -1px; }
.yt-search { background: #121212; border: 1px solid #303030; height: 30px; flex: 1; max-width: 240px; margin: 0 14px; border-radius: 15px; padding: 0 12px; display: flex; align-items: center; color: #909090; font-size: 12px; }
.yt-icons { display: flex; gap: 8px; align-items: center; }
.yt-icon { width: 22px; height: 22px; background: #303030; border-radius: 50%; }
.yt-avatar { width: 26px; height: 26px; background: linear-gradient(135deg,#4a6cb0,#6b8fd9); border-radius: 50%; }

.yt-player { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; overflow: hidden; }
.ad-content { position: absolute; inset: 0; background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px; text-align: center; overflow: hidden; }
.ad-content::before { content: "ADS ADS ADS ADS ADS"; position: absolute; top: 8px; left: -20px; right: -20px; font-size: 20px; font-weight: 900; color: rgba(255,255,255,0.18); letter-spacing: 6px; white-space: nowrap; }
.ad-content::after { content: "ADS ADS ADS ADS ADS"; position: absolute; bottom: 50px; left: -20px; right: -20px; font-size: 20px; font-weight: 900; color: rgba(255,255,255,0.18); letter-spacing: 6px; white-space: nowrap; }
.ad-headline { font-size: 64px; font-weight: 900; color: white; line-height: 0.95; margin-bottom: 8px; letter-spacing: -2px; text-shadow: 0 6px 20px rgba(0,0,0,0.5); }
.ad-sub { font-size: 14px; color: rgba(255,255,255,0.95); margin-bottom: 14px; font-weight: 700; letter-spacing: 1px; }
.ad-btn { background: #ffeb3b; color: #8b0000; padding: 10px 28px; border-radius: 4px; font-size: 15px; font-weight: 900; letter-spacing: 1px; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
.ad-badge { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.85); color: white; padding: 4px 9px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; z-index: 3; }
.skip-btn { position: absolute; bottom: 38px; right: 0; background: rgba(0,0,0,0.85); color: white; padding: 8px 12px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; border-left: 3px solid white; z-index: 3; }
.skip-btn .countdown { background: rgba(255,255,255,0.2); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }
.banner-ad-bottom { position: absolute; bottom: 26px; left: 0; right: 0; height: 22px; background: repeating-linear-gradient(45deg, #ff8c00, #ff8c00 8px, #ff6600 8px, #ff6600 16px); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: white; letter-spacing: 2px; z-index: 3; }
.yt-player-controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 12px; background: rgba(0,0,0,0.85); display: flex; align-items: center; gap: 8px; height: 26px; }
.yt-progress { flex: 1; height: 3px; background: rgba(255,255,255,0.3); position: relative; }
.yt-progress::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12%; background: #ffcb00; }
.yt-time { font-size: 10px; color: white; }
</style></head><body>
<div class="yt-header">
  <div class="yt-logo"><div class="yt-play"></div><div class="yt-brand">YouTube</div></div>
  <div class="yt-search">Search</div>
  <div class="yt-icons"><div class="yt-icon"></div><div class="yt-avatar"></div></div>
</div>
<div class="yt-player">
  <div class="ad-content">
    <div class="ad-headline">90% OFF<br>FOR LIFE</div>
    <div class="ad-sub">★ LIMITED TIME ★ CLICK NOW ★</div>
    <div class="ad-btn">LEARN MORE →</div>
  </div>
  <div class="ad-badge">Ad · 0:08 / 0:30</div>
  <div class="skip-btn">Skip Ad in <span class="countdown">5</span></div>
  <div class="banner-ad-bottom">★ ADVERTISEMENT ★ ADVERTISEMENT ★ ADVERTISEMENT ★</div>
  <div class="yt-player-controls">
    <span style="color:white;font-size:12px">⏸</span>
    <div class="yt-progress"></div>
    <span class="yt-time">0:08 / 0:30</span>
  </div>
</div>
</body></html>
